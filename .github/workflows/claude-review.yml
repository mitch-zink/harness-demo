name: Claude Code Review

# One review comment per PR (and on reopen or the `claude-review-again` label). Self-contained: a public repo can't
# call a private repo's reusable workflow.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'labeled' || github.event.label.name == 'claude-review-again')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_1 }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            1. Run: gh pr diff ${{ github.event.pull_request.number }}
            2. Run: gh pr view ${{ github.event.pull_request.number }}
            3. Post ONE review comment with gh pr comment ${{ github.event.pull_request.number }} --body "<review>": correctness,
               bugs, security and notable style issues, citing file:line. If it looks good, say so briefly. Always post it.
          claude_args: '--allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"'
